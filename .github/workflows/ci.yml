name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref cancels the unfinished run. On the default branch this is safe only because
# ci-scope.mjs selects every scope for a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id must stay `changes`: ci-gate.mjs reads the scopes from it.
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      # one line per scope of .github/ci/routing.json
      server: ${{ steps.scope.outputs.server }}
    steps:
      # every action at a full commit with its release in a comment (the github-ops skill: pin every action)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0             # a pull request is compared from its merge base
          persist-credentials: false
      - id: scope
        run: node .github/ci/ci-scope.mjs

  # Always runs, so no scope lists it and the gate always requires it.
  repo-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --test .github/ci/*.test.mjs

  rust-checks:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the toolchain and the musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - name: Lint
        run: cargo lint
      - name: Test
        run: cargo test --locked
      # The release ships static musl binaries; this builds one, which the host-target lint and tests do not.
      - name: Build the static release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

  # The one required check. `needs` must list every other job of this workflow. `always()` makes it run after a
  # failure or a skip upstream, which the default `success()` would not, and in a cancelled run, which
  # `!cancelled()` would not: a skipped required check counts as passing.
  ci-gate:
    name: CI gate
    needs: [changes, repo-policy, rust-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/ci-gate.mjs
