[package]
name = "rmcp-release-demo"
version = "0.1.0"
edition = "2024"
description = "A stdio MCP server with echo and version tools"
license = "MIT"
repository = "https://github.com/aloong-planet/rmcp-release-demo"

[dependencies]
rmcp = { version = "3.10.0", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "1"
toml = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
